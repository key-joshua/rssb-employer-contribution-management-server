version: '3.8'

services:

  api1:
    build: .
    container_name: api1
    env_file:
      - .env
    environment:
      SERVER_ID: api-1
    ports:
      - "3001:3000"
    restart: always

  api2:
    build: .
    container_name: api2
    env_file:
      - .env
    environment:
      SERVER_ID: api-2
    ports:
      - "3002:3000"
    restart: always

  api3:
    build: .
    container_name: api3
    env_file:
      - .env
    environment:
      SERVER_ID: api-3
    ports:
      - "3003:3000"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api1
      - api2
      - api3
